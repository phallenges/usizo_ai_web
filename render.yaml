services:
  - type: web
    name: usizoai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        sync: false
