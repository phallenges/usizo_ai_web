services:
  - type: web
    name: usizoai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: usizoai-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://usizoai-api.onrender.com

databases:
  - name: usizoai-db
    databaseName: usizoai
    user: usizoai
    plan: free
